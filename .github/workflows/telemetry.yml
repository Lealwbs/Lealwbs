name: Unified Gemini Profile

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_run:
    workflows:
      - Generate pacman animation
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main-updates
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate unified single-block Gemini profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/generate_dashboard.py

      - name: Commit updated unified profile SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/hero-dark.svg profile/hero-light.svg profile/readme-dark.svg profile/readme-light.svg PROFILE.md llms.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore(profile): update unified single-block Gemini profile [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
