name: GitHub Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-main-updates
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check METRICS_TOKEN
        id: check_token
        env:
          PAT: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Skipping lowlighter/metrics: METRICS_TOKEN (classic PAT) secret is not configured yet."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Generate metrics SVG
        if: steps.check_token.outputs.has_token == 'true'
        uses: lowlighter/metrics@latest
        with:
          filename: profile/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          config_twemoji: yes
          config_output: svg
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          committer_message: "chore(metrics): update GitHub metrics SVG [skip ci]"

      - name: Wire metrics SVG into README when generated
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          git pull --rebase origin main
          if [ -f profile/metrics.svg ]; then
            python3 -c 'import re, pathlib; p = pathlib.Path("README.md"); text = p.read_text(encoding="utf-8"); block = "<!-- BEGIN METRICS -->\n<br/><br/>\n<img alt=\"GitHub Metrics\" src=\"./profile/metrics.svg\">\n<!-- END METRICS -->"; new_text = re.sub(r"<!-- BEGIN METRICS -->.*?<!-- END METRICS -->", block, text, flags=re.S); p.write_text(new_text, encoding="utf-8") if new_text != text else None'
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            if ! git diff --staged --quiet; then
              git commit -m "docs(readme): embed generated GitHub metrics SVG [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          fi
